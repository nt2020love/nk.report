<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jayshree · Report By Nirakar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #020408;
    --bg-panel: rgba(8, 18, 32, 0.85);
    --neon-cyan: #00f5ff;
    --neon-pink: #ff006e;
    --neon-green: #39ff14;
    --neon-purple: #bf00ff;
    --neon-gold: #ffd700;
    --neon-orange: #ff6b00;
    --text-primary: #e0f4ff;
    --text-dim: #5a8fa8;
    --border-glow: rgba(0,245,255,0.25);
    --glass: rgba(0,245,255,0.04);
    --glass-hover: rgba(0,245,255,0.08);
    --card-border: rgba(0,245,255,0.15);
    --shadow-neon: 0 0 20px rgba(0,245,255,0.15), 0 0 60px rgba(0,245,255,0.05);
    --font-display: 'Orbitron', monospace;
    --font-body: 'Rajdhani', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
    --transition: all 0.3s cubic-bezier(0.23,1,0.32,1);
  }

  .theme-neon {
    --neon-cyan: #00f5ff;
    --neon-pink: #ff006e;
    --bg-dark: #000510;
    --bg-panel: rgba(0,10,25,0.9);
  }
  .theme-light {
    --bg-dark: #eef4fa;
    --bg-panel: rgba(255,255,255,0.82);
    --neon-cyan: #0077cc;
    --neon-pink: #cc0055;
    --neon-green: #007a00;
    --neon-purple: #7700cc;
    --neon-gold: #c89500;
    --neon-orange: #c85000;
    --text-primary: #0a1a2a;
    --text-dim: #4a6a8a;
    --border-glow: rgba(0,119,204,0.25);
    --glass: rgba(0,119,204,0.06);
    --glass-hover: rgba(0,119,204,0.12);
    --card-border: rgba(0,119,204,0.2);
    --shadow-neon: 0 4px 24px rgba(0,119,204,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
  }

  /* ── CANVAS BACKGROUND ── */
  #particle-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  /* ── ANIMATED GRADIENT ORBS ── */
  .orb {
    position: fixed; border-radius: 50%; filter: blur(80px);
    pointer-events: none; z-index: 0; opacity: 0.18;
    animation: orbDrift 18s ease-in-out infinite alternate;
  }
  .orb-1 { width: 500px; height: 500px; background: var(--neon-cyan); top: -150px; left: -150px; animation-delay: 0s; }
  .orb-2 { width: 400px; height: 400px; background: var(--neon-pink); bottom: -120px; right: -120px; animation-delay: -6s; }
  .orb-3 { width: 350px; height: 350px; background: var(--neon-purple); top: 40%; left: 40%; animation-delay: -12s; }
  @keyframes orbDrift {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(60px, 40px) scale(1.15); }
  }

  /* ── LOADER ── */
  #loader {
    position: fixed; inset: 0; background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; flex-direction: column; gap: 20px;
    transition: opacity 0.6s; 
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 80px; height: 80px;
    border: 3px solid rgba(0,245,255,0.15);
    border-top-color: var(--neon-cyan);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .loader-text { font-family: var(--font-display); font-size: 14px; color: var(--neon-cyan); letter-spacing: 4px; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* ── LAYOUT ── */
  #app { position: relative; z-index: 1; }

  /* ── STICKY HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(2,4,8,0.92);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border-glow);
    padding: 0 24px;
    box-shadow: 0 0 40px rgba(0,245,255,0.08);
  }
  .theme-light header { background: rgba(238,244,250,0.94); }

  .header-inner {
    max-width: 1600px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px; gap: 16px; flex-wrap: wrap;
  }

  .logo {
    font-family: var(--font-display);
    font-size: clamp(16px,3vw,22px);
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    white-space: nowrap;
  }
  .logo span { font-size: 10px; display: block; letter-spacing: 6px; font-weight: 400; }

  .header-controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }

  .search-wrap {
    position: relative; display: flex; align-items: center;
  }
  .search-icon { position: absolute; left: 12px; color: var(--neon-cyan); font-size: 14px; pointer-events: none; }
  #search-input {
    background: var(--glass);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    padding: 8px 16px 8px 36px;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    width: 220px;
    outline: none;
    transition: var(--transition);
  }
  #search-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 16px rgba(0,245,255,0.2);
    width: 260px;
  }
  #search-input::placeholder { color: var(--text-dim); }

  .btn {
    font-family: var(--font-body);
    font-size: 13px; font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: var(--glass);
    color: var(--text-primary);
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--glass-hover);
    border-color: var(--neon-cyan);
    box-shadow: 0 0 12px rgba(0,245,255,0.25);
    transform: translateY(-1px);
  }
  .btn-cyan { border-color: var(--neon-cyan); color: var(--neon-cyan); }
  .btn-pink { border-color: var(--neon-pink); color: var(--neon-pink); }
  .btn-green { border-color: var(--neon-green); color: var(--neon-green); }

  select#sort-select, select#theme-select {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: var(--bg-panel);
    color: var(--text-primary);
    cursor: pointer;
    outline: none;
    transition: var(--transition);
  }
  select:focus { border-color: var(--neon-cyan); }

  /* ── MAIN ── */
  main { max-width: 1600px; margin: 0 auto; padding: 28px 20px; }

  /* ── SECTION TITLES ── */
  .section-title {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--neon-cyan);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(to right, var(--border-glow), transparent);
  }

  /* ── SUMMARY CARDS ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--bg-panel);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(16px);
    transition: var(--transition);
    animation: fadeInUp 0.5s ease both;
  }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent, var(--neon-cyan));
    box-shadow: 0 0 12px var(--accent, var(--neon-cyan));
  }
  .stat-card::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at top left, rgba(0,245,255,0.04), transparent 60%);
    pointer-events: none;
  }
  .stat-card:hover {
    transform: translateY(-4px) scale(1.01);
    border-color: var(--accent, var(--neon-cyan));
    box-shadow: 0 0 30px rgba(0,245,255,0.15), var(--shadow-neon);
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stat-value {
    font-family: var(--font-display);
    font-size: clamp(20px,3vw,28px);
    font-weight: 700;
    color: var(--accent, var(--neon-cyan));
    line-height: 1;
    text-shadow: 0 0 20px var(--accent, rgba(0,245,255,0.5));
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    font-family: var(--font-mono);
  }
  .stat-icon {
    position: absolute; right: 16px; top: 16px;
    font-size: 28px; opacity: 0.15;
  }

  /* ── CHARTS ── */
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .chart-card {
    background: var(--bg-panel);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 22px;
    backdrop-filter: blur(16px);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
    animation: fadeInUp 0.6s ease both;
  }
  .chart-card:hover {
    border-color: rgba(0,245,255,0.3);
    box-shadow: var(--shadow-neon);
  }
  .chart-title {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--neon-cyan);
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .chart-wrap { position: relative; height: 220px; }

  /* ── ACTION BAR ── */
  .action-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .action-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ── TREE ── */
  #tree-container { display: flex; flex-direction: column; gap: 10px; }

  .person-card {
    background: var(--bg-panel);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    backdrop-filter: blur(16px);
    transition: border-color 0.3s;
    animation: fadeInUp 0.5s ease both;
  }
  .person-card:hover { border-color: rgba(0,245,255,0.35); }

  .person-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
    cursor: pointer;
    transition: background 0.2s;
    gap: 12px;
  }
  .person-header:hover { background: var(--glass-hover); }

  .person-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
  .person-avatar {
    width: 40px; height: 40px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 14px; font-weight: 700;
    flex-shrink: 0;
    border: 1px solid var(--card-border);
  }
  .person-name {
    font-family: var(--font-display);
    font-size: clamp(11px,2vw,14px);
    letter-spacing: 1px;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .person-meta { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }

  .person-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .person-total {
    font-family: var(--font-display);
    font-size: clamp(14px,2.5vw,18px);
    font-weight: 700;
    color: var(--neon-gold);
    text-shadow: 0 0 16px rgba(255,215,0,0.4);
  }
  .chevron {
    width: 20px; height: 20px;
    border-right: 2px solid var(--neon-cyan);
    border-bottom: 2px solid var(--neon-cyan);
    transform: rotate(45deg);
    transition: transform 0.35s cubic-bezier(0.23,1,0.32,1), box-shadow 0.3s;
    flex-shrink: 0;
  }
  .chevron.open {
    transform: rotate(-135deg);
    border-color: var(--neon-pink);
    box-shadow: 4px 4px 8px rgba(255,0,110,0.3);
  }

  /* ── ACCORDION BODY ── */
  .accordion-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.45s cubic-bezier(0.23,1,0.32,1), opacity 0.35s;
    opacity: 0;
  }
  .accordion-body.open { opacity: 1; }

  .year-section {
    margin: 0 16px 16px;
    border: 1px solid rgba(191,0,255,0.2);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(191,0,255,0.03);
  }

  .year-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    cursor: pointer;
    transition: background 0.2s;
    gap: 10px;
  }
  .year-header:hover { background: rgba(191,0,255,0.06); }
  .year-label {
    font-family: var(--font-display);
    font-size: 13px; letter-spacing: 2px;
    color: var(--neon-purple);
  }
  .year-total {
    font-family: var(--font-mono);
    font-size: 14px; color: var(--neon-purple);
  }
  .mini-chevron {
    width: 14px; height: 14px;
    border-right: 2px solid var(--neon-purple);
    border-bottom: 2px solid var(--neon-purple);
    transform: rotate(45deg);
    transition: transform 0.3s;
    flex-shrink: 0;
  }
  .mini-chevron.open { transform: rotate(-135deg); border-color: var(--neon-pink); }

  .months-body {
    overflow: hidden; max-height: 0;
    transition: max-height 0.4s cubic-bezier(0.23,1,0.32,1), opacity 0.3s;
    opacity: 0; padding: 0 12px;
  }
  .months-body.open { opacity: 1; }

  .month-section {
    margin-bottom: 10px;
    border: 1px solid rgba(0,245,255,0.1);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(0,245,255,0.02);
  }
  .month-section:first-child { margin-top: 12px; }

  .month-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.2s;
    gap: 10px;
  }
  .month-header:hover { background: rgba(0,245,255,0.05); }
  .month-label {
    font-family: var(--font-mono);
    font-size: 13px; color: var(--neon-cyan); letter-spacing: 2px;
  }
  .month-total { font-family: var(--font-mono); font-size: 13px; color: var(--neon-green); }
  .micro-chevron {
    width: 10px; height: 10px;
    border-right: 2px solid var(--neon-cyan);
    border-bottom: 2px solid var(--neon-cyan);
    transform: rotate(45deg);
    transition: transform 0.3s; flex-shrink: 0;
  }
  .micro-chevron.open { transform: rotate(-135deg); border-color: var(--neon-green); }

  .txn-body {
    overflow: hidden; max-height: 0;
    transition: max-height 0.35s cubic-bezier(0.23,1,0.32,1), opacity 0.25s;
    opacity: 0; padding: 0 10px;
  }
  .txn-body.open { opacity: 1; }

  .txn-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; margin: 4px 0;
    border-radius: 6px;
    background: var(--glass);
    border: 1px solid rgba(0,245,255,0.06);
    transition: background 0.2s, border-color 0.2s;
    animation: fadeIn 0.3s ease both;
  }
  .txn-row:first-child { margin-top: 8px; }
  .txn-row:last-child { margin-bottom: 8px; }
  .txn-row:hover { background: var(--glass-hover); border-color: rgba(0,245,255,0.18); }

  .txn-date {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-dim);
  }
  .txn-badge {
    font-size: 10px; letter-spacing: 1px;
    padding: 2px 8px; border-radius: 20px;
    font-family: var(--font-mono);
    background: rgba(0,245,255,0.08);
    color: var(--neon-cyan);
    border: 1px solid rgba(0,245,255,0.2);
  }
  .txn-amount {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--neon-green);
    text-shadow: 0 0 8px rgba(57,255,20,0.3);
  }

  /* ── EXPORT SECTION ── */
  .export-bar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 32px;
    padding: 16px 20px;
    background: var(--bg-panel);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    align-items: center;
  }
  .export-label {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-dim);
    letter-spacing: 2px; margin-right: 8px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap { margin: 4px 0 2px; }
  .progress-track {
    height: 3px; border-radius: 2px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 2px;
    transition: width 1.2s cubic-bezier(0.23,1,0.32,1);
    background: linear-gradient(to right, var(--neon-cyan), var(--neon-green));
    box-shadow: 0 0 8px rgba(0,245,255,0.5);
  }

  /* ── NO RESULTS ── */
  .no-results {
    text-align: center; padding: 60px 20px;
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 2px;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
  }

  /* ── SCANLINE EFFECT ── */
  .scanline {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(to right, transparent, rgba(0,245,255,0.15), transparent);
    animation: scanline 8s linear infinite;
    pointer-events: none; z-index: 2;
  }
  .theme-light .scanline { display: none; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    border-top: 1px solid var(--border-glow);
    margin-top: 40px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .header-inner { height: auto; padding: 12px 0; gap: 10px; }
    #search-input { width: 160px; }
    #search-input:focus { width: 180px; }
    .action-bar { flex-direction: column; align-items: flex-start; }
    .charts-grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .person-right .person-total { font-size: 14px; }
    .btn { padding: 7px 12px; font-size: 12px; }
  }
  @media (max-width: 420px) {
    .summary-grid { grid-template-columns: 1fr; }
    .person-name { font-size: 11px; }
  }

  /* Counter animation */
  .counter { display: inline-block; }

  /* Gradient text utility */
  .grad-text {
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">Jayshree · NK.Report_starting</div>
</div>

<div class="scanline"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<canvas id="particle-canvas"></canvas>

<div id="app">
  <header>
    <div class="header-inner">
      <div class="logo">Jayshree <span>Report By Nirakar</span></div>
      <div class="header-controls">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="Search parties...">
        </div>
        <select id="sort-select">
          <option value="default">⇅ Default</option>
          <option value="asc">↑ Lowest First</option>
          <option value="desc">↓ Highest First</option>
          <option value="alpha">A→Z Alpha</option>
        </select>
        <select id="theme-select">
          <option value="dark">◉ Dark</option>
          <option value="neon">◈ Neon</option>
          <option value="light">◌ Light</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <!-- SUMMARY -->

// ═══════════════════════════════════════════════════════════════
// STATS COMPUTATION
// ═══════════════════════════════════════════════════════════════
function computeStats() {
  const parties = Object.keys(RAW_DATA);
  const grandTotal = parties.reduce((s,k) => s + RAW_DATA[k].total, 0);
  let txnCount = 0;
  const yearTotals = {};
  const monthTotals = {};

  parties.forEach(name => {
    const p = RAW_DATA[name];
    Object.entries(p.years).forEach(([yr, ydata]) => {
      yearTotals[yr] = (yearTotals[yr]||0) + ydata.total;
      Object.entries(ydata.months).forEach(([mo, txns]) => {
        const key = `${mo} ${yr}`;
        monthTotals[key] = (monthTotals[key]||0) + txns.reduce((s,t)=>s+t[1],0);
        txnCount += txns.length;
      });
    });
  });

  const topSender = parties.reduce((a,b) => RAW_DATA[a].total > RAW_DATA[b].total ? a : b);
  return { parties: parties.length, grandTotal, txnCount, topSender, yearTotals, monthTotals };
}

// ═══════════════════════════════════════════════════════════════
// FORMATTING
// ═══════════════════════════════════════════════════════════════
function fmt(n) { return '₹' + n.toLocaleString('en-IN'); }

// ═══════════════════════════════════════════════════════════════
// ANIMATED COUNTER
// ═══════════════════════════════════════════════════════════════
function animateCounter(el, target, isRupee=false, duration=1200) {
  let start = null;
  const step = ts => {
    if (!start) start = ts;
    const prog = Math.min((ts - start) / duration, 1);
    const ease = 1 - Math.pow(1 - prog, 3);
    const val = Math.round(ease * target);
    el.textContent = isRupee ? fmt(val) : val.toLocaleString('en-IN');
    if (prog < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderCharts() {

    type: 'doughnut',
    data: {
      labels: parties,
      datasets: [{
        data: parties.map(p => RAW_DATA[p].total),
        backgroundColor: COLORS.map(c => c + '33'),
        borderColor: COLORS,
        borderWidth: 2,
        hoverBorderWidth: 3,
        hoverOffset: 8,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '68%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.label}: ${fmt(ctx.parsed)}`
          }
        }
      },
      animation: { animateRotate: true, duration: 1200 }
    }
  });

  // Bar – year totals
  const bCtx = document.getElementById('chart-bar');
  if (window._bChart) window._bChart.destroy();
  const years = Object.keys(stats.yearTotals).sort();
  window._bChart = new Chart(bCtx, {
    type: 'bar',
    data: {
      labels: years,
      datasets: [{
        label: 'Total',
        data: years.map(y => stats.yearTotals[y]),
        backgroundColor: years.map((_,i) => COLORS[i % COLORS.length] + '44'),
        borderColor: years.map((_,i) => COLORS[i % COLORS.length]),
        borderWidth: 2,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: gridColor } },
        y: { grid: { color: gridColor }, ticks: { callback: v => '₹' + (v/1000).toFixed(0)+'K' } }
      },
      animation: { duration: 1200 }
    }
  });

  // Line – monthly flow
  const lCtx = document.getElementById('chart-line');
  if (window._lChart) window._lChart.destroy();
  const MONTH_ORDER = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthKeys = Object.keys(stats.monthTotals).sort((a,b) => {
    const [mA, yA] = a.split(' '); const [mB, yB] = b.split(' ');
    if (yA !== yB) return yA - yB;
    return MONTH_ORDER.indexOf(mA) - MONTH_ORDER.indexOf(mB);
  });
  window._lChart = new Chart(lCtx, {
    type: 'line',
    data: {
      labels: monthKeys,
      datasets: [{
        label: 'Monthly Flow',
        data: monthKeys.map(k => stats.monthTotals[k]),

        backgroundColor: 'rgba(0,245,255,0.06)',
        borderWidth: 2,
        pointBackgroundColor: '#00f5ff',
        pointBorderColor: '#020408',
        pointRadius: 4,
        pointHoverRadius: 7,
        tension: 0.45,
        fill: true,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: gridColor }, ticks: { maxRotation: 45, maxTicksLimit: 10 } },
        y: { grid: { color: gridColor }, ticks: { callback: v => '₹' + (v/1000).toFixed(0)+'K' } }
      },
      animation: { duration: 1200 }

// ═══════════════════════════════════════════════════════════════
// AVATAR COLORS
// ═══════════════════════════════════════════════════════════════
function avatarColor(name) {
  const h = [...name].reduce((s,c) => (s<<5)-s+c.charCodeAt(0)|0, 0);
  return COLORS[Math.abs(h) % COLORS.length];
}

function monthSum(txns) { return txns.reduce((s,t)=>s+t[1],0); }

// ═══════════════════════════════════════════════════════════════
// TREE RENDER
// ═══════════════════════════════════════════════════════════════
let currentData = {};

function renderTree(data) {
  currentData = data;
  const container = document.getElementById('tree-container');
  const keys = Object.keys(data);
  document.getElementById('result-count').textContent = `SHOWING ${keys.length} PARTIES`;

  if (keys.length === 0) {
    container.innerHTML = '<div class="no-results">⚠ NO MATCHING PARTIES FOUND</div>';
    return;
  }

  const grandTotal = Object.values(RAW_DATA).reduce((s,p)=>s+p.total,0);

  container.innerHTML = keys.map((name, pi) => {
    const person = data[name];
    const color = avatarColor(name);
    const initials = name.split(' ').slice(0,2).map(w=>w[0]).join('');
    const pct = Math.round((person.total / grandTotal) * 100);

    const yearsHtml = Object.entries(person.years).map(([yr, ydata]) => {
      const monthsHtml = Object.entries(ydata.months).map(([mo, txns]) => {
        const mSum = monthSum(txns);
        const txnHtml = txns.map(([date, amt]) => `
          <div class="txn-row">
            <span class="txn-date">${date}</span>
            <span class="txn-badge">TXN</span>
            <span class="txn-amount">${fmt(amt)}</span>
          </div>
        `).join('');
        return `
          <div class="month-section">
            <div class="month-header" onclick="toggleAcc(this,'txn-body','.micro-chevron')">
              <span class="month-label">${mo.toUpperCase()}</span>
              <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">${txns.length} TXN${txns.length>1?'S':''}</span>
              <span class="month-total">${fmt(mSum)}</span>
              <div class="micro-chevron"></div>
            </div>
            <div class="txn-body">${txnHtml}</div>
          </div>
        `;
      }).join('');
      return `
        <div class="year-section">
          <div class="year-header" onclick="toggleAcc(this,'months-body','.mini-chevron')">
            <span class="year-label">◈ ${yr}</span>
            <span style="flex:1"></span>
            <span class="year-total">${fmt(ydata.total)}</span>
            <div class="mini-chevron"></div>
          </div>
          <div class="months-body" style="padding-bottom:10px">${monthsHtml}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="person-card" style="animation-delay:${pi*0.06}s">
        <div class="person-header" onclick="togglePerson(this)">
          <div class="person-left">
            <div class="person-avatar" style="background:${color}1a;border-color:${color}44;color:${color}">${initials}</div>
            <div>
              <div class="person-name">${name}</div>
              <div class="person-meta">${Object.keys(person.years).join(' · ')} &nbsp;|&nbsp; ${pct}% of portfolio</div>
            </div>
          </div>
          <div class="person-right">
            <div class="person-total">${fmt(person.total)}</div>
            <div class="chevron"></div>
          </div>
        </div>
        <div class="accordion-body">
          <div style="padding:0 16px 4px;margin-bottom:6px">
            <div class="progress-track" style="height:4px">
              <div class="progress-fill" style="width:${pct}%;background:linear-gradient(to right,${color},${color}88)"></div>
            </div>
          </div>
          ${yearsHtml}
        </div>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
// ACCORDION TOGGLE
// ═══════════════════════════════════════════════════════════════
function togglePerson(header) {
  const card = header.closest('.person-card');
  const body = card.querySelector('.accordion-body');
  const chevron = header.querySelector('.chevron');
  const isOpen = body.classList.contains('open');

  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => {
      body.style.maxHeight = '0';
      body.classList.remove('open');
    });
    chevron.classList.remove('open');
  } else {
    body.classList.add('open');
    body.style.maxHeight = '0';
    requestAnimationFrame(() => {
      body.style.maxHeight = body.scrollHeight + 5000 + 'px';
    });
    chevron.classList.add('open');
  }
}

function toggleAcc(header, bodyClass, chevronSel) {
  const parent = header.parentElement;
  const body = parent.querySelector('.' + bodyClass);
  const chevron = header.querySelector(chevronSel);
  const isOpen = body.classList.contains('open');

  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => {
      body.style.maxHeight = '0';
      body.classList.remove('open');
    });
    if (chevron) chevron.classList.remove('open');
  } else {
    body.classList.add('open');
    body.style.maxHeight = '0';
    requestAnimationFrame(() => {
      body.style.maxHeight = body.scrollHeight + 5000 + 'px';
    });
    if (chevron) chevron.classList.add('open');
  }

  // Expand parent person card's height
  const personBody = parent.closest('.accordion-body');
  if (personBody && personBody.classList.contains('open')) {
    setTimeout(() => {
      personBody.style.maxHeight = personBody.scrollHeight + 5000 + 'px';
    }, 10);
  }
}

// ═══════════════════════════════════════════════════════════════
// EXPAND / COLLAPSE ALL
// ═══════════════════════════════════════════════════════════════
function expandAll() {
  document.querySelectorAll('.person-card').forEach(card => {
    const body = card.querySelector('.accordion-body');
    const chevron = card.querySelector('.chevron');
    if (!body.classList.contains('open')) {
      body.classList.add('open');
      body.style.maxHeight = '9999px';
      if (chevron) chevron.classList.add('open');
    }
    card.querySelectorAll('.months-body, .txn-body').forEach(b => {
      b.classList.add('open');
      b.style.maxHeight = '9999px';
    });
    card.querySelectorAll('.mini-chevron, .micro-chevron').forEach(c => c.classList.add('open'));
  });
}

function collapseAll() {
  document.querySelectorAll('.accordion-body, .months-body, .txn-body').forEach(b => {
    b.style.maxHeight = '0';
    b.classList.remove('open');
  });
  document.querySelectorAll('.chevron, .mini-chevron, .micro-chevron').forEach(c => c.classList.remove('open'));
}

// ═══════════════════════════════════════════════════════════════
// SEARCH & SORT
// ═══════════════════════════════════════════════════════════════
function getFilteredSorted() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const sort = document.getElementById('sort-select').value;

  let entries = Object.entries(RAW_DATA).filter(([name]) =>
    !q || name.toLowerCase().includes(q)
  );

  if (sort === 'desc') entries.sort((a,b) => b[1].total - a[1].total);
  else if (sort === 'asc') entries.sort((a,b) => a[1].total - b[1].total);
  else if (sort === 'alpha') entries.sort((a,b) => a[0].localeCompare(b[0]));

  return Object.fromEntries(entries);
}

document.getElementById('search-input').addEventListener('input', () => renderTree(getFilteredSorted()));
document.getElementById('sort-select').addEventListener('change', () => renderTree(getFilteredSorted()));

  renderCharts();

// ═══════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════
function exportJSON() {
  const blob = new Blob([JSON.stringify(RAW_DATA, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'nexus_transactions.json'; a.click();
}

function exportCSV() {
  const rows = [['Party','Year','Month','Date','Amount']];
  Object.entries(RAW_DATA).forEach(([name, p]) => {
    Object.entries(p.years).forEach(([yr, yd]) => {
      Object.entries(yd.months).forEach(([mo, txns]) => {
        txns.forEach(([date, amt]) => rows.push([name, yr, mo, date, amt]));
      });
    });
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'nexus_transactions.csv'; a.click();
}

// ═══════════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════════
function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;

  const particles = Array.from({length: 55}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    vx: (Math.random()-.5)*0.3, vy: (Math.random()-.5)*0.3,
    r: Math.random()*1.5+0.5,
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    alpha: Math.random()*0.4+0.1,
  }));

  function draw() {
    ctx.clearRect(0,0,W,H);
    if (document.body.classList.contains('theme-light')) return requestAnimationFrame(draw);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color + Math.round(p.alpha*255).toString(16).padStart(2,'0');
      ctx.fill();
    });
    // Connection lines
    for (let i = 0; i < particles.length; i++) {
      for (let j = i+1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 110) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0,245,255,${0.06*(1-dist/110)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();

  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  initParticles();

  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
    renderSummary();
    renderCharts();
    renderTree(getFilteredSorted());
  }, 1400);
});
</script>
